# Orquestracao local dos dois processos do backend (so para execucao local).
# A GUI JavaFX NAO e containerizada (precisa de display): corre no host e liga-se
# a localhost:8000, demonstrando o jogo entre modos (GUI vs Web).
#
# Arranque:  docker compose up --build
#   - Web (JSP/WebSocket/servlets):  http://localhost:8080/
#   - Servidor de jogo TCP:          localhost:8000

services:
  game-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8000:8000"
    volumes:
      - dab-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      # O ServerProxy (F2) le estas propriedades para contactar o servidor.
      CATALINA_OPTS: "-Ddab.server.host=game-server -Ddab.server.port=8000"
    ports:
      - "8080:8080"
    depends_on:
      - game-server
    restart: unless-stopped

volumes:
  # Volume nomeado: preserva Users.xml/Profiles.xml/audit.log entre reinicios.
  dab-data:
