services:
  game-server:
    build:
      context: .
      dockerfile: server.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - dab-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    environment:
      # O ServerProxy le estas propriedades para contactar o servidor.
      CATALINA_OPTS: "-Ddab.server.host=game-server -Ddab.server.port=8000"
    ports:
      - "8080:8080"
    depends_on:
      - game-server
    restart: unless-stopped

volumes:
  # Volume nomeado: preserva Users.xml/Profiles.xml/audit.log entre reinicios.
  dab-data:
